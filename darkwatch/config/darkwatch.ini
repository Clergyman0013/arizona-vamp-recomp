; Darkwatch Recompiled - options
;
; Values here are read at startup. Environment variables win over the file
; (DARKWATCH_WIDESCREEN=1 etc.), and command line flags are not used.
; Every option is optional; anything missing keeps its default.

[Video]

; Window size. 0 = derive from the guest backbuffer * resolution_scale.
window_width  = 0
window_height = 0

; Internal scale factor applied to the window (1 = the game's own 640x480,
; 2 = 1280x960, 3 = 1920x1440). The guest keeps rendering at its native
; backbuffer size; the presentation layer upscales.
resolution_scale = 3

; 1 = widen the horizontal FOV so the 4:3-authored projection fills a 16:9
; (or any wider) window instead of being stretched. 0 = original behaviour.
widescreen = 1

; Extra FOV multiplier on top of `widescreen`. 1.0 = untouched.
fov_scale = 1.0

; 0 = windowed, 1 = borderless fullscreen.
fullscreen = 0

; 1 = vsync (recommended), 0 = uncapped unless fps_limit is set.
vsync = 1

; Frame cap; 0 = uncapped.
fps_limit = 0

[Audio]

audio = 1
audio_volume = 100

[Input]

; 1 = keyboard mapping for the Xbox pad (arrows/WASD + key map), 0 = pads only.
keyboard = 1

; Left stick deadzone, percent.
deadzone = 10

[Debug]

verbose = 0
; 1 = map guest page 0 as no-access, so null dereferences fault where they
; happen instead of quietly reading zero.
trap_null = 0
; Seconds of no progress before the watchdog reports; 0 = off.
watchdog_seconds = 0

; [Game data]
; Where default.xbe and the .pck files live. Leave empty to auto-detect
; (game/, game_files/, ../game_files, next to the executable).
; game_dir = game_files
